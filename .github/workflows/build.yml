name: Build Nexus

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the newest Nexus zip
        run: |
          ZIP=$(ls Nexus_Step*.zip 2>/dev/null | sort -V | tail -1)
          if [ -z "$ZIP" ]; then echo "No Nexus_Step zip found in the repo"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleRelease -PGITHUB_REPO=${{ github.repository }} -PVERSION_CODE=${{ github.run_number }} --no-daemon

      - name: Name the APK
        run: cp project/app/build/outputs/apk/release/app-release.apk Nexus.apk

      - name: Keep a copy in the run page
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-apk
          path: Nexus.apk

      - name: Publish release (the in-app updater reads this)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Nexus build ${{ github.run_number }}
          body_path: project/RELEASE_NOTES.md
          files: Nexus.apk
